name: force-ui-repair
on:
  push:
    branches: [feat/global-news-provenance-ui]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-news-provenance-ui
      - name: Apply repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace("$('#search').onclick=function(){mode='home';render()};q.addEventListener('keydown',function(e){if(e.key==='Enter'){mode='home';render()}});$('#back').onclick=function(){detail.classList.add('hidden');home.classList.remove('hidden')};", "$('#search').onclick=function(){mode='home';render()};q.addEventListener('keydown',function(e){if(e.key==='Enter'){mode='home';render()}});")
          s=s.replace("function decode(v){var ta=document.createElement('textarea');ta.innerHTML=String(v==null?'':v);return ta.value}", "function decode(v){var s=String(v==null?'':v);for(var i=0;i<5;i++){var ta=document.createElement('textarea');ta.innerHTML=s;var d=ta.value;if(d===s)break;s=d}return s}")
          if 'function normalizeStory' not in s:
              marker="function flag(c){return flagMap[c]||'🌐'}"
              fn="function normalizeStory(s){var x=Object.assign({},s);x.headline=decode(x.headline);x.summary=decode(x.summary);x.body=decode(x.body);x.category=decode(x.category);x.country=decode(x.country||'');if(!x.country)x.country=x.category==='India'?'India':'Global';x.verification_status=decode(x.verification_status||'unverified');return x}\n"
              s=s.replace(marker,fn+marker)
          s=s.replace("stories=await r.json();state.innerHTML", "stories=(await r.json()).map(normalizeStory);state.innerHTML")
          s=re.sub(r"function setRegion\(r\)\{.*?\n\}", "function setRegion(r){mode='home';category='Home';region=r;selectedCountry='All';countrySearch.value='';menuOpen=false;renderRegions();renderCountryMenu();explorerHint.textContent=r==='All'?'Home shows worldwide coverage. Select a region to see its countries, or choose a country to filter the feed.':'Showing '+r+' countries. Select a country to filter the feed.';render()}", s, count=1, flags=re.S)
          s=re.sub(r"function setCountry\(c\)\{.*?\n\}", "function setCountry(c){mode='home';category='Home';selectedCountry=c;region='All';countrySearch.value=c;menuOpen=false;renderCountryMenu();explorerHint.textContent=flag(c)+' '+c+' selected. Showing stories whose country metadata is '+c+'.';render()}", s, count=1, flags=re.S)
          s=re.sub(r"story-reader-v2\.js\?v=\d+", "story-reader-v2.js?v=13", s)
          p.write_text(s,encoding='utf-8')
          p=Path('story-reader-v2.js'); r=p.read_text(encoding='utf-8')
          if 'window.__GLOBAL_NEWS_STORY_READER_V2__' not in r:
              r=r.replace("(()=>{\n'use strict';", "(()=>{\n'use strict';\nif(window.__GLOBAL_NEWS_STORY_READER_V2__)return;window.__GLOBAL_NEWS_STORY_READER_V2__=true;")
          r=r.replace("#detail>.detail-wrap>.detail-toolbar,#detail #back,#detail .back{display:none!important}", "#detail>.detail-wrap>.detail-toolbar,#detail #back,#detail .back:not(.story-v2-back){display:none!important}")
          r=r.replace("function esc(v){return String(v??'').replace(/[&<>\\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\"'\":'&#39;'}[c]))}", "function esc(v){return decode(v).replace(/[&<>\\\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\"'\":'&#39;'}[c]))}")
          r=r.replace("function clean(detail){detail.querySelectorAll('.story-v2-back,.story-v2-back-wrap,.back,#storyV2Back').forEach(x=>x.remove())}", "function clean(detail){detail.querySelectorAll('.story-v2-back,.story-v2-back-wrap,.back,#storyV2Back').forEach(x=>x.remove());detail.querySelectorAll('.detail-toolbar').forEach(x=>x.remove())}")
          r=re.sub(r"function report\(body,summary,points\)\{.*?\n?\}", "function report(body,summary,points){const b=decode(body).trim(),sum=decode(summary).trim(),p=(Array.isArray(points)?points:[]).map(decode).map(x=>x.trim()).filter(x=>x.length>20);if(b.length>=450&&b!==sum)return {html:paragraphs(b),note:''};if(p.length)return {html:`<div class=\"story-v2-report-label\">Source-grounded report</div><div>${p.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`,note:'This report is synthesized from source-grounded material available to the platform.'};if(sum)return {html:paragraphs(sum),note:'Only limited source material is currently available for this story.'};return {html:'<div class=\"story-v2-empty\">A detailed report is not available yet.</div>',note:''}}", r, count=1, flags=re.S)
          r=r.replace('class=\\"storyV2Back\\"', 'class=\\"back story-v2-back\\"')
          p.write_text(r,encoding='utf-8')
          PY
          node --check story-reader-v2.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html story-reader-v2.js
          git rm -f .github/workflows/repair-global-news-ui.yml .github/workflows/force-ui-repair.yml || true
          git commit -m 'fix: stabilize story reader and country filters'
          git push origin feat/global-news-provenance-ui
