name: Sync country tab for PR
on:
  pull_request_target:
    types: [synchronize, opened, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/global-news-provenance-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Patch country tab label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = "function render(){"
          injection = "function render(){var countryTab=document.getElementById('myCountryTab');if(countryTab)countryTab.textContent=selectedCountry!=='All'?flag(selectedCountry)+' '+selectedCountry:'🇮🇳 India';"
          if "countryTab.textContent=selectedCountry" in s:
              print('country tab sync already present')
          elif marker in s:
              s = s.replace(marker, injection, 1)
              p.write_text(s)
          else:
              raise SystemExit('render function not found')
          PY
      - name: Push patch to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: sync country tab with selected country'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
