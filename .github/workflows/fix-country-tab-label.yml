name: Apply preview UI patches
on:
  push:
    branches: [feat/global-news-provenance-ui]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-news-provenance-ui
      - name: Ensure versioned Story Reading Experience scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<script src="./story-reader-v2.js"></script>', '<script src="./story-reader-v2.js?v=3"></script>')
          s = s.replace('<script src="./story-content-v2.js"></script>', '<script src="./story-content-v2.js?v=3"></script>')
          tags = ['<script src="./story-reader-v2.js?v=3"></script>', '<script src="./story-content-v2.js?v=3"></script>']
          marker = '</body>'
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s)
          PY
      - name: Remove legacy Story Reader back injection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('story-reader-v2.js')
          s = p.read_text()
          s = s.replace('<div class="story-v2-back"><button id="storyV2Back" class="back">← Back to stories</button></div>', '')
          s = s.replace("document.querySelector('#storyV2Back').onclick=()=>{detail.classList.add('hidden');home.classList.remove('hidden');};", '')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html story-reader-v2.js
          if git diff --cached --quiet; then
            echo 'No UI patch needed.'
          else
            git commit -m 'fix: cache-bust story reader and remove legacy back control'
            git push origin feat/global-news-provenance-ui
          fi
