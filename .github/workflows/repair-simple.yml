name: repair-simple
on:
  push:
    branches: [feat/global-news-provenance-ui]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-news-provenance-ui
      - name: Apply simple deterministic fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace("$('#search').onclick=function(){mode='home';render()};q.addEventListener('keydown',function(e){if(e.key==='Enter'){mode='home';render()}});$('#back').onclick=backHome;", "$('#search').onclick=function(){mode='home';render()};q.addEventListener('keydown',function(e){if(e.key==='Enter'){mode='home';render()}});")
          s=s.replace("stories=await r.json();state.innerHTML", "stories=await r.json();stories.forEach(function(s){if(!s.country)s.country=s.category==='India'?'India':'Global'});state.innerHTML")
          s=s.replace("function setCountry(c){selectedCountry=c;countrySearch.value=c;menuOpen=false;renderCountryMenu();explorerHint.textContent=flag(c)+' '+c+' selected. News feed is filtered to this country.';render()}", "function setCountry(c){mode='home';category='Home';selectedCountry=c;region='All';countrySearch.value=c;menuOpen=false;renderCountryMenu();explorerHint.textContent=flag(c)+' '+c+' selected. News feed is filtered to this country.';render()}")
          s=s.replace('story-reader-v2.js?v=11','story-reader-v2.js?v=13')
          p.write_text(s,encoding='utf-8')

          p=Path('story-reader-v2.js'); r=p.read_text(encoding='utf-8')
          r=r.replace("(()=>{\n'use strict';", "(()=>{\n'use strict';\nif(window.__GLOBAL_NEWS_STORY_READER_V2__)return;window.__GLOBAL_NEWS_STORY_READER_V2__=true;")
          r=r.replace("#detail>.detail-wrap>.detail-toolbar,#detail #back,#detail .back{display:none!important}", "#detail>.detail-wrap>.detail-toolbar,#detail #back,#detail .back:not(.story-v2-back){display:none!important}")
          r=r.replace('class="storyV2Back"','class="back story-v2-back"')
          marker="function flag(c){return ({India:'🇮🇳',China:'🇨🇳',Japan:'🇯🇵','South Korea':'🇰🇷',Indonesia:'🇮🇩',Singapore:'🇸🇬',France:'🇫🇷',Germany:'🇩🇪',Greece:'🇬🇷',Italy:'🇮🇹',Spain:'🇪🇸','United Kingdom':'🇬🇧','United States':'🇺🇸',Canada:'🇨🇦',Australia:'🇦🇺','New Zealand':'🇳🇿','Saudi Arabia':'🇸🇦','United Arab Emirates':'🇦🇪',Israel:'🇮🇱',Iran:'🇮🇷',Brazil:'🇧🇷','South Africa':'🇿🇦'}[c]||'🌐')}"
          if 'function escDecoded(v)' not in r:
              r=r.replace(marker, "function escDecoded(v){return decode(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\n"+marker)
              r=r.replace('${esc(', '${escDecoded(')
          r=r.replace("function clean(detail){detail.querySelectorAll('.story-v2-back,.story-v2-back-wrap,.back,#storyV2Back').forEach(x=>x.remove())}", "function clean(detail){detail.querySelectorAll('.story-v2-back,.story-v2-back-wrap,.back,#storyV2Back').forEach(x=>x.remove());detail.querySelectorAll('.detail-toolbar').forEach(x=>x.remove())}")
          report_marker='async function openV2(id)'
          if 'Source-grounded report' not in r:
              report_fn="function report(body,summary,points){const b=decode(body).trim(),sum=decode(summary).trim(),p=(Array.isArray(points)?points:[]).map(decode).map(x=>x.trim()).filter(x=>x.length>20);if(b.length>=450&&b!==sum)return {html:paragraphs(b),note:''};if(p.length)return {html:`<div class=\"story-v2-report-label\">Source-grounded report</div><div>${p.map(x=>`<p>${escDecoded(x)}</p>`).join('')}</div>`,note:'This report is synthesized from source-grounded material available to the platform.'};if(sum)return {html:paragraphs(sum),note:'Only limited source material is currently available for this story.'};return {html:'<div class=\"story-v2-empty\">A detailed report is not available yet.</div>',note:''}}\n"
              r=r.replace(report_marker, report_fn+report_marker)
          p.write_text(r,encoding='utf-8')
          PY
          node --check story-reader-v2.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html story-reader-v2.js
          git rm -f .github/workflows/repair-global-news-ui.yml .github/workflows/force-ui-repair.yml .github/workflows/repair-simple.yml || true
          git commit -m 'fix: stabilize news story reader and country filtering'
          git push origin feat/global-news-provenance-ui
