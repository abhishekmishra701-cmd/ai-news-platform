name: AI News E2E

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e_base_url:
        description: 'Optional deployed URL to test'
        required: false
        type: string

jobs:
  desktop:
    name: Playwright Desktop E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run Desktop E2E
        env:
          E2E_BASE_URL: ${{ inputs.e2e_base_url }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            node tests/e2e/mock-server.js > /tmp/e2e-server.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            for i in {1..30}; do
              curl -fsS http://127.0.0.1:4173/ >/dev/null && break
              sleep 1
            done
            curl -fsS http://127.0.0.1:4173/ >/dev/null
          fi
          timeout 390s npx playwright test --project=chromium --reporter=line
      - name: Upload Desktop report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-playwright-desktop
          path: |
            playwright-report/
            test-results/
            /tmp/e2e-server.log
          if-no-files-found: ignore

  mobile:
    name: Playwright Mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run Mobile E2E
        env:
          E2E_BASE_URL: ${{ inputs.e2e_base_url }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            node tests/e2e/mock-server.js > /tmp/e2e-server.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            for i in {1..30}; do
              curl -fsS http://127.0.0.1:4173/ >/dev/null && break
              sleep 1
            done
            curl -fsS http://127.0.0.1:4173/ >/dev/null
          fi
          timeout 390s npx playwright test --project=mobile-chrome --reporter=line
      - name: Upload Mobile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-playwright-mobile
          path: |
            playwright-report/
            test-results/
            /tmp/e2e-server.log
          if-no-files-found: ignore
