name: AI News E2E

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e_base_url:
        description: 'Optional deployed URL to test; leave empty to test the canonical production deployment'
        required: false
        type: string

jobs:
  e2e:
    name: Playwright E2E (Desktop + Mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Resolve E2E target
        id: target
        env:
          INPUT_URL: ${{ inputs.e2e_base_url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            echo "base_url=$INPUT_URL" >> "$GITHUB_OUTPUT"
            echo "target=deployed URL supplied by workflow input" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://ai-news-platform-cyan.vercel.app/?utm_source=chatgpt.com" >> "$GITHUB_OUTPUT"
            echo "target=canonical production deployment" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for canonical deployment
        if: ${{ inputs.e2e_base_url == '' }}
        run: |
          for i in {1..30}; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' 'https://ai-news-platform-cyan.vercel.app/?utm_source=chatgpt.com' || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Canonical deployment did not become ready in time"
          exit 1
      - name: Run Desktop E2E
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: npx playwright test --project=chromium --reporter=line
      - name: Run Mobile E2E
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: npx playwright test --project=mobile-chrome --reporter=line
      - name: Publish E2E summary
        if: always()
        run: |
          {
            echo "## AI News E2E Regression"
            echo "- Target mode: ${{ steps.target.outputs.target }}"
            echo "- Desktop project: chromium"
            echo "- Mobile project: mobile-chrome"
            echo "- See separate Desktop and Mobile step results above for PASS/FAIL."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
