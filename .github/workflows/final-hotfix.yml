name: final-hotfix
on:
  push:
    branches: [feat/global-news-provenance-ui]
permissions:
  contents: write
jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-news-provenance-ui
      - name: Remove fatal legacy back handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("$('#back').onclick=function(){detail.classList.add('hidden');home.classList.remove('hidden')};", '')
          s=s.replace('story-reader-v2.js?v=13','story-reader-v2.js?v=14')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/final-hotfix.yml
          git commit -m 'fix: remove fatal legacy back handler'
          git push origin feat/global-news-provenance-ui
