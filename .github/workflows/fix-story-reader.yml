name: Patch story reader
on:
  push:
    branches: [feat/global-news-provenance-ui]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-news-provenance-ui
      - name: Patch story reader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('story-reader-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('#detail>.detail-wrap>.detail-toolbar,#detail #back,#detail .back:not(#storyV2Back){display:none!important}', '#detail>.detail-wrap>.detail-toolbar,#detail #back,#detail .back{display:none!important}')
          s=s.replace('function clean(detail){detail.querySelectorAll(\'.story-v2-back,.story-v2-back-wrap,.back\').forEach(x=>x.remove())}', 'function clean(detail){detail.querySelectorAll(\'.story-v2-back,.story-v2-back-wrap,.back,#storyV2Back\').forEach(x=>x.remove())}')
          s=s.replace('<button id="storyV2Back" class="back" type="button">← Back to stories</button>', '<button id="storyV2Back" class="storyV2Back" type="button">← Back to stories</button>')
          s=s.replace('const rr=report(s.body,s.summary,points);document.querySelector(\'#storyReport\').innerHTML=rr.html+(rr.note?`<div class="story-v2-report-note">${esc(rr.note)}</div>`:\'\');', 'const rr=report(s.body,s.summary,points);document.querySelector(\'#storyReport\').innerHTML=rr.html+(rr.note?`<div class="story-v2-report-note">${esc(rr.note)}</div>`:\'\');')
          # If the brief endpoint succeeds, the report must use its source-grounded points when no substantive body exists.
          s=s.replace("if(p.length)return {html:`<div class=\"story-v2-report-label\">What the available sources report</div><ul class=\"story-v2-report-points\">${p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,note:'This report is synthesized only from source-grounded material available to the platform. Unsupported details have not been added.'};", "if(p.length)return {html:`<div class=\"story-v2-report-label\">What the available sources report</div><ul class=\"story-v2-report-points\">${p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,note:'This report is synthesized only from source-grounded material available to the platform. Unsupported details have not been added.'};")
          p.write_text(s,encoding='utf-8')
          i=Path('index.html')
          x=i.read_text(encoding='utf-8')
          x=x.replace('./story-reader-v2.js?v=10','./story-reader-v2.js?v=11')
          i.write_text(x,encoding='utf-8')
          PY
          node --check story-reader-v2.js
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add story-reader-v2.js index.html
          git commit -m 'fix: story reader duplicate back and report rendering'
          git rm .github/workflows/fix-story-reader.yml
          git commit -m 'chore: remove temporary story reader patch workflow'
          git push origin feat/global-news-provenance-ui