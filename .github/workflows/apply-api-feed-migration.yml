name: Apply API feed migration

on:
  push:
    branches:
      - fix/api-authoritative-feed

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'fix: migrate browser feed to api news'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Patch only the browser feed loader
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          pattern = r"async function load\(\)\{.*?\}\nnav\.addEventListener"
          replacement = """async function load(){try{var r=await fetch('/api/news',{headers:{Accept:'application/json'}});if(!r.ok)throw Error('API '+r.status);stories=await r.json();if(!Array.isArray(stories))throw Error('Invalid API payload');stories.forEach(function(s){if(!s.country)s.country=s.category==='India'?'India':'Global'});window.__GLOBAL_NEWS_COUNTRY_RECONCILED__=true;state.innerHTML='<span class=\"dot\"></span>API connected';notice.textContent='Live news · '+stories.length+' stories available';notice.className='notice';render()}catch(e){window.__GLOBAL_NEWS_COUNTRY_RECONCILED__=false;state.textContent='Connection error';notice.textContent=e.name==='AbortError'?'News feed timed out.':'News feed could not be loaded.';notice.className='notice error';render()}}\nnav.addEventListener"""

          patched, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected exactly one browser load() function; refusing to modify index.html')
          path.write_text(patched, encoding='utf-8')

      - name: Verify migration invariants
        run: |
          ! grep -q "api('news_stories?" index.html
          grep -q "fetch('/api/news'" index.html
          grep -q "__GLOBAL_NEWS_COUNTRY_RECONCILED__" index.html

      - name: Commit targeted migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached -- index.html
          git commit -m "fix: migrate browser feed to api news"
          git push

# Intentional second push after workflow creation: GitHub Actions cannot run a workflow
# from the same push that first introduces the workflow definition.
