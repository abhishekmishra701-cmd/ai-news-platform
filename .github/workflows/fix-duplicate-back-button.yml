name: Fix duplicate story back button
on:
  push:
    branches: [feat/global-news-provenance-ui]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-news-provenance-ui
      - name: Patch story reader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('story-reader-v2.js')
          s=p.read_text(encoding='utf-8')
          old='#detail>.detail-wrap>.detail-toolbar,#detail #back{display:none!important}'
          new='#detail>.detail-wrap>.detail-toolbar,#detail #back,#detail .back:not(#storyV2Back){display:none!important}'
          if old not in s:
              raise SystemExit('Expected story-reader CSS selector not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          i=Path('index.html')
          x=i.read_text(encoding='utf-8')
          x=re.sub(r'story-reader-v2\\.js\\?v=\\d+', 'story-reader-v2.js?v=10', x)
          i.write_text(x,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('story-reader-v2.js').read_text(encoding='utf-8')
          i=Path('index.html').read_text(encoding='utf-8')
          assert '#detail .back:not(#storyV2Back)' in r
          assert 'story-reader-v2.js?v=10' in i
          PY
          node --check story-reader-v2.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add story-reader-v2.js index.html
          git commit -m 'fix: hide duplicate story back button'
          git push origin feat/global-news-provenance-ui
