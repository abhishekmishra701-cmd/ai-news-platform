name: Hard fix story UI
on:
  push:
    branches: [feat/global-news-provenance-ui]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-news-provenance-ui
      - name: Normalize final story UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Repair the previous patch's accidental literal backslash-n in the inline script.
          s=s.replace('}\\nfunction esc(v){', '}\nfunction esc(v){')
          # Keep only the V2 reader and ensure its cache version changes with this fix.
          s=re.sub(r'\./story-reader-v2\.js\?v=[0-9]+', './story-reader-v2.js?v=7', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          i=Path('index.html').read_text(encoding='utf-8')
          r=Path('story-reader-v2.js').read_text(encoding='utf-8')
          assert 'function openStory' not in i
          assert "var b=e.target.closest('[data-open]');if(b)openStory" not in i
          assert '<div class="detail-toolbar">' not in i
          assert 'story-reader-v2.js?v=7' in i
          assert '\\nfunction esc(v)' not in i
          assert 'storyV2Back' in r
          assert "detail.querySelectorAll('.back').forEach(el=>el.remove())" in r
          assert len(re.findall(r'<script\s+src=["\']\./story-reader-v2\.js\?v=7["\']\s*></script>', i))==1
          PY
          node --check story-reader-v2.js
      - name: Commit final normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html story-reader-v2.js
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'fix: normalize story reader and cache version'; git push origin feat/global-news-provenance-ui; fi
