name: Hard fix story UI
on:
  push:
    branches: [feat/global-news-provenance-ui]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-news-provenance-ui
      - name: Remove legacy story renderer and decode feed text
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # There must be exactly one story renderer. The old inline renderer creates its own
          # detail markup and its own navigation, which was the source of duplicate controls.
          s=re.sub(r'<div class="detail-toolbar">.*?</div>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'async function openStory\(id\)\{.*?\}\nnav\.addEventListener', 'nav.addEventListener', s, count=1, flags=re.S)
          s=s.replace("document.addEventListener('click',function(e){if(!e.target.closest('.country-control'))closeMenu();var b=e.target.closest('[data-open]');if(b)openStory(b.dataset.open)});", "document.addEventListener('click',function(e){if(!e.target.closest('.country-control'))closeMenu();});")
          old="function esc(v){return String(v==null?'':v).replace(/[&<>\\\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\"'\":'&#39;'}[c]})}"
          new="function decode(v){var ta=document.createElement('textarea');ta.innerHTML=String(v==null?'':v);return ta.value}\\nfunction esc(v){return String(decode(v)).replace(/[&<>\\\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\"'\":'&#39;'}[c]})}"
          if old not in s: raise SystemExit('esc function pattern not found')
          s=s.replace(old,new,1)
          s=re.sub(r'\./story-reader-v2\.js\?v=[0-9]+', './story-reader-v2.js?v=6', s)
          p.write_text(s,encoding='utf-8')

          p=Path('story-reader-v2.js')
          s=p.read_text(encoding='utf-8')
          # Make the story reader itself responsible for the ONLY back control.
          s=s.replace("detail.querySelectorAll('.back').forEach(el=>{if(el.id!=='back')el.remove()});", "detail.querySelectorAll('.back').forEach(el=>el.remove());")
          marker="article.innerHTML='<div class=\"story-v2-loading\">Opening story…</div>';scrollTo(0,0);"
          replacement="article.innerHTML='<div class=\"story-v2-back-wrap\"><button id=\"storyV2Back\" class=\"back\" type=\"button\">← Back to stories</button></div><div class=\"story-v2-loading\">Opening story…</div>';document.querySelector('#storyV2Back').onclick=()=>{detail.classList.add('hidden');home.classList.remove('hidden');};scrollTo(0,0);"
          if marker not in s: raise SystemExit('story reader insertion point not found')
          s=s.replace(marker,replacement,1)
          s=s.replace('.story-v2{max-width:980px;', '.story-v2-back-wrap{margin:0 0 18px}.story-v2{max-width:980px;',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify hard-fix invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          i=Path('index.html').read_text(encoding='utf-8')
          r=Path('story-reader-v2.js').read_text(encoding='utf-8')
          assert 'function openStory' not in i
          assert "var b=e.target.closest('[data-open]');if(b)openStory" not in i
          assert 'story-reader-v2.js?v=6' in i
          assert 'storyV2Back' in r
          assert "detail.querySelectorAll('.back').forEach(el=>el.remove())" in r
          assert len(re.findall(r'<script\s+src=["\']\./story-reader-v2\.js\?v=6["\']\s*></script>', i))==1
          PY
      - name: Commit hard fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html story-reader-v2.js
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'fix: remove legacy story renderer and entity encoding bugs'; git push origin feat/global-news-provenance-ui; fi
