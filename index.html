<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global News</title>
<style>
:root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--navy:#0b1220;--blue:#2563eb;--soft:#eef4ff;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#fff);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.bar,main{max-width:1240px;margin:auto}.top{background:var(--navy);color:#fff}.top .bar{min-height:66px;padding:0 20px;display:flex;align-items:center}.brand{font-size:22px;font-weight:850;margin-right:auto}.brand span{color:#8ab4ff}.state{font-size:12px;color:#cbd5e1}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399;margin-right:6px}.navwrap{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.nav{display:flex;gap:3px;padding:9px 14px;overflow:auto}.nav button{border:0;background:transparent;color:#475467;font-weight:650;padding:10px 12px;border-radius:9px;white-space:nowrap}.nav .active{background:#eaf1ff;color:#194185}main{padding:28px 20px 60px}.search{display:flex;gap:10px}.searchbox{flex:1}.search input,.country-picker input{width:100%;height:50px;padding:0 15px;border:1px solid #cfd5df;border-radius:12px;background:#fff;outline:none}.search button,.read{border:0;background:var(--ink);color:#fff;padding:0 18px;border-radius:11px;font-weight:700}.notice{margin-top:16px;padding:10px 13px;border-radius:9px;background:var(--soft);font-size:13px;border:1px solid #dbe7ff}.notice.error{background:#fffaeb;color:#b54708}.hero{margin-top:16px;background:linear-gradient(135deg,#101828,#1d2939);color:#fff;border-radius:18px;padding:28px}.hero h1{font-size:30px;line-height:1.16;margin:14px 0 10px}.hero p{color:#d0d5dd;line-height:1.6}.hero .read{background:#fff;color:#101828;margin-top:8px}.explorer{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px}.explorer-top{display:flex;align-items:center;gap:12px}.explorer-title{font-size:14px;font-weight:800}.explorer-title span{font-size:12px;color:var(--muted);font-weight:500;margin-left:5px}.country-picker{margin-left:auto;display:flex;align-items:center;gap:7px}.country-picker label{font-size:12px;font-weight:800}.country-picker input{width:235px;height:38px;border-radius:9px;font-size:12px}.country-clear{height:38px;border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:0 11px;font-weight:700}.region-row,.country-row{display:flex;gap:6px;overflow:auto;padding-bottom:2px}.region-row{margin-top:11px}.country-row{margin-top:9px}.region-row button,.country-row button{border:1px solid #d0d5dd;background:#fff;color:#344054;padding:6px 10px;border-radius:999px;font-size:11px;white-space:nowrap}.region-row .active,.country-row .active{background:#eaf1ff;border-color:#a8c7ff;color:#194185;font-weight:700}.country-row-wrap{display:none}.country-row-wrap.visible{display:block}.country-row-label{font-size:10px;color:#98a2b3;margin-top:7px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-top:28px}.sectionhead h2{font-size:23px;margin:0}.count{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;min-height:250px;display:flex;flex-direction:column}.card h3{font-size:18px;line-height:1.3;margin:13px 0 8px}.card p{line-height:1.55;color:#475467}.card .read{align-self:flex-start;margin-top:auto;height:38px;font-size:12px}.label-row{display:flex;gap:7px;flex-wrap:wrap}.badge,.pill,.country-tag{display:inline-flex;align-items:center;border-radius:999px;font-size:10px;font-weight:800;padding:5px 9px}.badge{background:#f2f4f7;color:#475467}.badge.verified,.badge.published{background:#ecfdf3;color:#067647}.badge.developing{background:#fffaeb;color:#b54708}.pill{background:#f2f4f7;color:#475467;font-size:11px}.country-tag{background:var(--soft);color:#194185;font-size:11px}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d0d5d </style></head><body>
<header class="top"><div class="bar"><div class="brand">GLOBAL <span>NEWS</span></div><div id="state" class="state">Starting…</div></div></header>
<div class="navwrap"><div class="bar nav" id="nav"><button data-mode="home" class="active">Home</button><button data-mode="country" id="myCountryTab">🇮🇳 India</button><button data-cat="India">India</button><button data-cat="World">World</button><button data-cat="Geopolitics">Geopolitics</button><button data-cat="International Relations">International Relations</button><button data-cat="Business">Business</button><button data-cat="Technology">Technology</button><button data-cat="Entertainment">Entertainment</button><button data-cat="Sports">Sports</button><button data-cat="Science">Science</button><button data-cat="Climate">Climate</button></div></div>
<main><section id="home"><div class="search"><div class="searchbox"><input id="q" placeholder="Search global stories, topics, countries or sources…"></div><button id="search">Search</button></div><div id="notice" class="notice">Loading live news…</div><div id="hero"></div>

<script>
(()=>{const URL="https://nfqwnrmwyhcycjsfwqfl.supabase.co",KEY="sb_publishable_FXSeGzRWwQ3FbyBWf_z80g_DHlcLcCl";let mode="home",category="Home",stories=[],selectedCountry="All",region="All";
const regions={All:["All"],Asia:["India","China","Japan","South Korea","Indonesia","Singapore","Thailand","Vietnam","Malaysia","Philippines","Pakistan","Bangladesh","Sri Lanka","Nepal"],Europe:["United Kingdom","France","Germany","Italy","Spain","Portugal","Netherlands","Belgium","Switzerland","Sweden","Norway","Denmark","Finland","Poland","Ukraine","Russia","European Union"],"North America":["United States","Canada","Mexico"],"South America":["Brazil","Argentina","Chile","Colombia","Peru","Venezuela","Ecuador","Bolivia","Uruguay","Paraguay"],"Middle East":["Saudi Arabia","United Arab Emirates","Israel","Iran","Iraq","Qatar","Kuwait","Oman","Jordan","Egypt","Türkiye"],Africa:["South Africa","Nigeria","Kenya","Ethiopia","Ghana","Morocco","Algeria","Tunisia","Tanzania","Uganda","Zimbabwe"],Oceania:["Australia","New Zealand","Fiji","Papua New Guinea"]};const countries=[...new Set(Object.values(regions).flat())].filter(x=>x!=="All").sort();const $=s=>document.querySelector(s),nav=$("#nav"),grid=$("#grid"),hero=$("#hero"),notice=$("#notice"),q=$("#q"),state=$("#state"),listTitle=$("#listTitle"),count=$("#storyCount"),home=$("#home"),detail=$("#detail"),article=$("#article"),countrySearch=$("#countrySearch"),countryOptions=$("#countryOptions"),regionsEl=$("#regions"),countryRowWrap=$("#countryRowWrap"),countryRow=$("#countryRow"),countryRowLabel=$("#countryRowLabel"),myCountry=$("#myCountryTab");
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));const flag=c=>({India:"🇮🇳","United States":"🇺🇸","United Kingdom":"🇬🇧",Canada:"🇨🇦",Australia:"🇦🇺",Germany:"🇩🇪",France:"🇫🇷",Japan:"🇯🇵",China:"🇨🇳",Singapore:"🇸🇬","United Arab Emirates":"🇦🇪","Saudi Arabia":"🇸🇦"}[c]||"🌐");const badge=s=>`<span class="badge">${esc((s||"unverified").toUpperCase())}</span>`;
function detect(){const l=(navigator.language||"").toLowerCase(),m=l.match(/[-_]([a-z]{2})$/),map={in:"India",us:"United States",gb:"United Kingdom",ca:"Canada",au:"Australia",de:"Germany",fr:"France",jp:"Japan",cn:"China",sg:"Singapore",ae:"United Arab Emirates",sa:"Saudi Arabia"};return map[m?.[1]||""]||"India"}
function renderExplorer(){const list=region==="All"?countries:regions[region];regionsEl.innerHTML=Object.keys(regions).map(r=>`<button data-region="${esc(r)}" class="${r===region?"active":""}">${esc(r)}</button>`).join("");countryOptions.innerHTML=list.map(c=>`<option value="${esc(c)}"></option>`).join("");countrySearch.placeholder=region==="All"?"Search or select country…":`Search ${region} country…`;countryRowWrap.classList.toggle("visible",region!=="All");if(region!=="All"){countryRow.innerHTML=list.map(c=>`<button data-country="${esc(c)}" class="${c===selectedCountry?"active":""}">${flag(c)} ${esc(c)}</button>`).join("");countryRowLabel.textContent=`Countries in ${region} · choose one to filter the news`}}
function setCountry(c){if(c&&countries.includes(c)){selectedCountry=c;mode="country";category="Country";countrySearch.value=c}else{selectedCountry="All";mode="home";category="Home";countrySearch.value=""}renderExplorer();render()}
function setRegion(r){region=r;if(r==="All"){selectedCountry="All";mode="home";category="Home";countrySearch.value=""}else{selectedCountry="All";mode="region";category="Region";countrySearch.value=""}renderExplorer();render()}
function api(path){return fetch(URL+"/rest/v1/"+path,{headers:{apikey:KEY,Authorization:"Bearer "+KEY,Accept:"application/json"}})}
function data(){let d=mode==="home"?stories:mode==="country"?stories.filter(s=>(s.country||"Global").toLowerCase()===selectedCountry.toLowerCase()):mode==="region"?stories.filter(s=>regions[region]?.some(c=>(s.country||"").toLowerCase()===c.toLowerCase())):stories.filter(s=>(s.category||"").toLowerCase()===category.toLowerCase());const t=q.value.trim().toLowerCase();return t?d.filter(s=>(s.headline+" "+(s.summary||"")+" "+(s.category||"")+" "+(s.country||"")).toLowerCase().includes(t)):d}
function render(){nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",(mode==="home"&&b.dataset.mode==="home")||(mode==="country"&&b.dataset.mode==="country")||(mode==="category"&&b.dataset.cat===category)));const d=data(),h=mode==="home"&&!q.value.trim()?d[0]:null;hero.innerHTML=h?`<div class="hero">${badge(h.verification_status)} <span class="pill">${h.source_count||0} sources</span> <span class="country-tag">${flag(h.country||"Global")} ${esc(h.country||"Global")}</span><h1>${esc(h.headline)}</h1><p>${esc(h.summary||"")}</p><button class="read" data-open="${h.id}">Read full story →</button></div>`:"";const a=mode==="home"&&!q.value.trim()?d.slice(1):d;listTitle.textContent=mode==="home"?"Top Stories · Worldwide":mode==="country"?`${flag(selectedCountry)} ${selectedCountry} Stories`:mode==="region"?`${region} Stories`:`${category} Stories`;count.textContent=`${d.length} stories`;grid.innerHTML=a.length?a.map(s=>`<article class="card"><div class="label-row">${badge(s.verification_status)}<span class="pill">${s.source_count||0} source${(s.source_count||0)===1?"":"s"}</span><span class="country-tag">${flag(s.country||"Global")} ${esc(s.country||"Global")}</span></div><h3>${esc(s.headline)}</h3><p style="font-size:12px;color:#667085">${esc(s.category||"General")}</p><p>${esc(s.summary||"")}</p><button class="read" data-open="${s.id}">Read story →</button></article>`).join(""):"<div class=\"empty\"><h3>No stories found</h3><p>Try another region, country, category or search term.</p></div>"}
async function load(){try{const r=await api("news_stories?status=in.(verified,published,corrected,developing)&select=id,slug,headline,summary,body,category,country,status,verification_status,source_count,correction_notice,published_at,created_at,updated_at&order=published_at.desc.nullslast,created_at.desc");if(!r.ok)throw Error("Supabase "+r.status);stories=await r.json();state.innerHTML='<span class="dot"></span>Supabase connected';notice.textContent=`Live news · ${stories.length} stories available`;render()}catch(e){state.textContent="Connection error";notice.textContent="News feed could not be loaded.";notice.className="notice error"}}
async function openStory(id){const r=await api("news_stories?id=eq."+encodeURIComponent(id)+"&select=*");if(!r.ok)return;const s=(await r.json())[0];if(!s)return;const sr=await api("news_sources?story_id=eq."+encodeURIComponent(id)+"&select=publisher,url,title,excerpt&order=created_at.asc"),sources=sr.ok?await sr.json():[];const text=s.summary||s.body||s.headline,points=text.split(/(?<=[.!?])\s+/).filter(x=>x.length>30).slice(0,5);article.innerHTML=`<div class="story-card"><div class="story-head"><div class="label-row">${badge(s.verification_status)}<span class="pill">${s.source_count||sources.length||0} sources</span><span class="pill">${esc(s.category||"General")}</span><span class="country-tag">${flag(s.country||"Global")} ${esc(s.country||"Global")}</span></div><h1>${esc(s.headline)}</h1><p class="lead">${esc(s.summary||s.body||"")}</p></div><section class="story-section"><h2>Story brief</h2><div class="brief"><ul>${(points.length?points:[text]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section><section class="story-section"><h2>What the sources report</h2><div class="source-grid">${sources.length?sources.map(x=>`<div class="source-card"><div class="publisher">${esc(x.publisher||"Source")}</div><div class="title">${esc(x.title||"Original report")}</div>${x.excerpt?`<div class="excerpt">${esc(x.excerpt)}</div>`:""}<a href="${esc(x.url||"#")}" target="_blank" rel="noopener">Open original source →</a></div>`).join(""):"<div class="count">Source details unavailable.</div>"}</div></section><div class="verify"><strong>Verification:</strong> ${esc(s.verification_status||"unverified")}. ${((s.source_count||sources.length||0)<2)?"Single-source report; not independently corroborated.":"Multiple source records attached."}</div></div>`;home.classList.add("hidden");detail.classList.remove("hidden");scrollTo(0,0)}
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.mode==="home"){setRegion("All");q.value=""}else if(b.dataset.mode==="country"){setCountry(selectedCountry==="All"?detect():selectedCountry);q.value=""}else if(b.dataset.cat){mode="category";category=b.dataset.cat;selectedCountry="All";region="All";countrySearch.value="";renderExplorer();q.value="";render()}scrollTo(0,0)});
regionsEl.addEventListener("click",e=>{const b=e.target.closest("[data-region]");if(b)setRegion(b.dataset.region)});countryRow.addEventListener("click",e=>{const b=e.target.closest("[data-country]");if(b)setCountry(b.dataset.country)});countrySearch.addEventListener("change",()=>setCountry(countrySearch.value.trim()));countrySearch.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();setCountry(countrySearch.value.trim())}});$("#countryClear").onclick=()=>setRegion("All");$("#search").onclick=render;q.onkeydown=e=>{if(e.key==="Enter")render()};document.addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b)openStory(b.dataset.open)});$("#back").onclick=()=>{detail.classList.add("hidden");home.classList.remove("hidden")};const initial=detect();myCountry.textContent=`${flag(initial)} ${initial}`;renderExplorer();load()})();
</script></body></html>
