<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global News</title>
<style>
:root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--navy:#0b1220;--blue:#2563eb;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#fff);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.bar,main{max-width:1240px;margin:auto}.top{background:var(--navy);color:#fff}.top .bar{min-height:66px;padding:0 20px;display:flex;align-items:center}.brand{font-size:22px;font-weight:850;margin-right:auto}.brand span{color:#8ab4ff}.state{font-size:12px;color:#cbd5e1}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399;margin-right:6px}.navwrap{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.nav{display:flex;gap:3px;padding:9px 14px;overflow:auto}.nav button{border:0;background:transparent;color:#475467;font-weight:650;padding:10px 12px;border-radius:9px;white-space:nowrap}.nav .active{background:#eaf1ff;color:#194185}main{padding:28px 20px 60px}.search{display:flex;gap:10px}.searchbox{flex:1}.search input,.country-picker input{width:100%;height:50px;padding:0 15px;border:1px solid #cfd5df;border-radius:12px;background:#fff;outline:none}.search button,.read{border:0;background:var(--ink);color:#fff;padding:0 18px;border-radius:11px;font-weight:700}.notice{margin-top:16px;padding:10px 13px;border-radius:9px;background:var(--soft);font-size:13px;border:1px solid #dbe7ff}.notice.error{background:#fffaeb;color:#b54708}.hero{margin-top:16px;background:linear-gradient(135deg,#101828,#1d2939);color:#fff;border-radius:18px;padding:28px}.hero h1{font-size:30px;line-height:1.16;margin:14px 0 10px}.hero p{color:#d0d5dd;line-height:1.6}.hero .read{background:#fff;color:#101828;margin-top:8px}.explorer{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px}.explorer-top{display:flex;align-items:center;gap:12px}.explorer-title{font-size:14px;font-weight:800}.explorer-title span{font-size:12px;color:var(--muted);font-weight:500;margin-left:5px}.country-picker{margin-left:auto;display:flex;align-items:center;gap:7px}.country-picker label{font-size:12px;font-weight:800}.country-picker input{width:235px;height:38px;border-radius:9px;font-size:12px}.country-clear{height:38px;border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:0 11px;font-weight:700}.region-row,.country-row{display:flex;gap:6px;overflow:auto;padding-bottom:2px}.region-row{margin-top:11px}.country-row{margin-top:9px}.region-row button,.country-row button{border:1px solid #d0d5dd;background:#fff;color:#344054;padding:6px 10px;border-radius:999px;font-size:11px;white-space:nowrap}.region-row .active,.country-row .active{background:#eaf1ff;border-color:#a8c7ff;color:#194185}.country-row-wrap{display:none}.country-row-wrap.visible{display:block}.country-row-label{font-size:10px;color:#98a2b3;margin-top:7px}.explorer-hint{font-size:10px;color:#98a2b3;margin-top:7px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-top:28px}.sectionhead h2{font-size:23px;margin:0}.count{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;min-height:250px;display:flex;flex-direction:column}.card h3{font-size:18px;line-height:1.3;margin:13px 0 8px}.card p{line-height:1.55;color:#475467}.card .read{align-self:flex-start;margin-top:auto;height:38px;font-size:12px}.label-row{display:flex;gap:7px;flex-wrap:wrap}.badge,.pill,.country-tag{display:inline-flex;align-items:center;border-radius:999px;font-size:10px;font-weight:800;padding:5px 9px}.badge{background:#f2f4f7;color:#475467}.pill{background:#f2f4f7;color:#475467;font-size:11px}.country-tag{background:var(--soft);color:#194185;font-size:11px}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d0d5dd;border-radius:15px;padding:45px;text-align:center;color:var(--muted)}.hidden{display:none}.detail-wrap{max-width:980px;margin:auto}.detail-toolbar{display:flex;justify-content:space-between;margin-bottom:18px}.back{height:38px;background:#fff;color:#344054;border:1px solid #d0d5dd}.story-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px}.story-head{border-bottom:1px solid #eef0f3;padding-bottom:24px}.story-head h1{font-size:38px;line-height:1.13;margin:16px 0 12px}.lead{font-size:17px;line-height:1.7;color:#475467}.story-section{margin-top:28px}.story-section h2{font-size:19px}.brief{background:#f8fafc;border:1px solid #e7ebf0;border-radius:14px;padding:20px}.brief ul{margin:0;padding-left:21px}.brief li{padding:5px 0;line-height:1.65}.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.source-card{border:1px solid var(--line);border-radius:13px;padding:16px}.source-card .publisher{font-weight:800}.source-card .title{font-size:13px;font-weight:650;margin-top:7px}.source-card .excerpt{font-size:12px;line-height:1.6;color:var(--muted);margin-top:8px}.source-card a{display:inline-block;margin-top:10px;color:var(--blue);font-size:12px;font-weight:750}.verify{margin-top:24px;padding:14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.footer{max-width:1240px;margin:auto;padding:22px 20px;color:#98a2b3;font-size:11px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.source-grid{grid-template-columns:1fr}}@media(max-width:650px){main{padding:18px 12px 45px}.search{flex-direction:column}.search input{height:46px}.search button{height:44px}.explorer-top{flex-wrap:wrap;align-items:flex-start}.country-picker{margin-left:0;width:100%}.country-picker input{width:100%}.grid{grid-template-columns:1fr}.story-card{padding:20px}.story-head h1{font-size:28px}.lead{font-size:15px}}
</style>
</head>
<body>
<header class="top"><div class="bar"><div class="brand">GLOBAL <span>NEWS</span></div><div id="state" class="state">Starting…</div></div></header>
<div class="navwrap"><div class="bar nav" id="nav">
<button data-mode="home" class="active">Home</button><button data-mode="country" id="myCountryTab">🇮🇳 India</button>
<button data-cat="India">India</button><button data-cat="World">World</button><button data-cat="Geopolitics">Geopolitics</button><button data-cat="International Relations">International Relations</button><button data-cat="Business">Business</button><button data-cat="Technology">Technology</button><button data-cat="Entertainment">Entertainment</button><button data-cat="Sports">Sports</button><button data-cat="Science">Science</button><button data-cat="Climate">Climate</button>
</div></div>
<main>
<section id="home">
<div class="search"><div class="searchbox"><input id="q" placeholder="Search global stories, topics, countries or sources…"></div><button id="search">Search</button></div>
<div id="notice" class="notice">Loading live news…</div><div id="hero"></div>
<div class="explorer">
<div class="explorer-top"><div class="explorer-title">🌍 Explore Worldwide <span>Regions &amp; countries</span></div><div class="country-picker"><label>Country</label><input id="countrySearch" list="countryOptions" placeholder="Search or select country…" autocomplete="off"><datalist id="countryOptions"></datalist><button id="countryClear" class="country-clear">All</button></div></div>
<div class="region-row" id="regions"></div>
<div id="countryRowWrap" class="country-row-wrap"><div class="country-row" id="countryRow"></div><div id="countryRowLabel" class="country-row-label"></div></div>
<div class="explorer-hint">Home shows worldwide coverage. Select a region to see its countries, or choose a country to personalize the feed.</div>
</div>
<div class="sectionhead"><h2 id="listTitle">Top Stories · Worldwide</h2><div id="storyCount" class="count"></div></div><div id="grid" class="grid"></div>
</section>
<section id="detail" class="hidden"><div class="detail-wrap"><div class="detail-toolbar"><button id="back" class="back">← Back to stories</button><span id="detailStatus" class="count"></span></div><div id="article"></div></div></section>
</main><div class="footer">Global News · Source attribution and provenance preserved · Worldwide coverage</div>
<script>
(function(){
  'use strict';
  var SUPABASE_URL='https://nfqwnrmwyhcycjsfwqfl.supabase.co';
  var SUPABASE_KEY='sb_publishable_FXSeGzRWwQ3FbyBWf_z80g_DHlcLcCl';
  var mode='home', category='Home', stories=[], selectedCountry='All', region='All';
  var regions={
    All:['All'],
    Asia:['India','China','Japan','South Korea','Indonesia','Singapore','Thailand','Vietnam','Malaysia','Philippines','Pakistan','Bangladesh','Sri Lanka','Nepal'],
    Europe:['United Kingdom','France','Germany','Italy','Spain','Portugal','Netherlands','Belgium','Switzerland','Sweden','Norway','Denmark','Finland','Poland','Ukraine','Russia','European Union'],
    'North America':['United States','Canada','Mexico'],
    'South America':['Brazil','Argentina','Chile','Colombia','Peru','Venezuela','Ecuador','Bolivia','Uruguay','Paraguay'],
    'Middle East':['Saudi Arabia','United Arab Emirates','Israel','Iran','Iraq','Qatar','Kuwait','Oman','Jordan','Egypt','Türkiye'],
    Africa:['South Africa','Nigeria','Kenya','Ethiopia','Ghana','Morocco','Algeria','Tunisia','Tanzania','Uganda','Zimbabwe'],
    Oceania:['Australia','New Zealand','Fiji','Papua New Guinea']
  };
  var countries=[];
  Object.keys(regions).forEach(function(r){regions[r].forEach(function(c){if(c!=='All' && countries.indexOf(c)<0) countries.push(c);});});
  countries.sort();
  function $(id){return document.getElementById(id);}
  var nav=$('nav'), grid=$('grid'), hero=$('hero'), notice=$('notice'), q=$('q'), state=$('state'), listTitle=$('listTitle'), count=$('storyCount');
  var home=$('home'), detail=$('detail'), article=$('article'), countrySearch=$('countrySearch'), countryOptions=$('countryOptions');
  var regionsEl=$('regions'), countryRowWrap=$('countryRowWrap'), countryRow=$('countryRow'), countryRowLabel=$('countryRowLabel'), myCountry=$('myCountryTab');
  function esc(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c;});}
  function flag(c){var m={'India':'🇮🇳','United States':'🇺🇸','United Kingdom':'🇬🇧','Canada':'🇨🇦','Australia':'🇦🇺','Germany':'🇩🇪','France':'🇫🇷','Japan':'🇯🇵','China':'🇨🇳','Singapore':'🇸🇬','United Arab Emirates':'🇦🇪','Saudi Arabia':'🇸🇦'};return m[c]||'🌐';}
  function badge(s){return '<span class="badge">'+esc(String(s||'unverified').toUpperCase())+'</span>';}
  function detect(){var l=(navigator.language||'').toLowerCase();var m=l.match(/[-_]([a-z]{2})$/);var map={in:'India',us:'United States',gb:'United Kingdom',ca:'Canada',au:'Australia',de:'Germany',fr:'France',jp:'Japan',cn:'China',sg:'Singapore',ae:'United Arab Emirates',sa:'Saudi Arabia'};return map[m?m[1]:'']||'India';}
  function renderExplorer(){
    var list=region==='All'?countries:(regions[region]||[]);
    var regionHtml='';Object.keys(regions).forEach(function(r){regionHtml+='<button type="button" data-region="'+esc(r)+'" class="'+(r===region?'active':'')+'">'+esc(r)+'</button>';});
    regionsEl.innerHTML=regionHtml;
    countryOptions.innerHTML=list.filter(function(c){return c!=='All';}).map(function(c){return '<option value="'+esc(c)+'"></option>';}).join('');
    countrySearch.placeholder=region==='All'?'Search or select country…':'Search '+region+' country…';
    countryRowWrap.classList.toggle('visible',region!=='All');
    if(region!=='All'){
      countryRow.innerHTML=list.map(function(c){return '<button type="button" data-country="'+esc(c)+'" class="'+(c===selectedCountry?'active':'')+'">'+flag(c)+' '+esc(c)+'</button>';}).join('');
      countryRowLabel.textContent='Countries in '+region+' · choose one to filter the news';
    }else{countryRow.innerHTML='';countryRowLabel.textContent='';}
  }
  function setCountry(c){
    if(c && countries.indexOf(c)>=0){selectedCountry=c;mode='country';category='Country';countrySearch.value=c;}
    else{selectedCountry='All';mode='home';category='Home';countrySearch.value='';}
    renderExplorer();render();
  }
  function setRegion(r){
    if(!regions[r]) r='All';region=r;
    if(r==='All'){selectedCountry='All';mode='home';category='Home';countrySearch.value='';}
    else{selectedCountry='All';mode='region';category='Region';countrySearch.value='';}
    renderExplorer();render();
  }
  function api(path){return fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,Accept:'application/json'}});}
  function filtered(){
    var d=stories.slice();
    if(mode==='country') d=d.filter(function(s){return String(s.country||'Global').toLowerCase()===selectedCountry.toLowerCase();});
    else if(mode==='region') d=d.filter(function(s){var cs=regions[region]||[];return cs.some(function(c){return String(s.country||'').toLowerCase()===c.toLowerCase();});});
    else if(mode==='category') d=d.filter(function(s){return String(s.category||'').toLowerCase()===category.toLowerCase();});
    var term=q.value.trim().toLowerCase();
    if(term)d=d.filter(function(s){return (String(s.headline||'')+' '+String(s.summary||'')+' '+String(s.category||'')+' '+String(s.country||'')).toLowerCase().indexOf(term)>=0;});
    return d;
  }
  function render(){
    nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',(mode==='home'&&b.getAttribute('data-mode')==='home')||(mode==='country'&&b.getAttribute('data-mode')==='country')||(mode==='category'&&b.getAttribute('data-cat')===category));});
    var d=filtered();var first=(mode==='home'&&!q.value.trim())?d[0]:null;
    hero.innerHTML=first?'<div class="hero">'+badge(first.verification_status)+' <span class="pill">'+(first.source_count||0)+' sources</span> <span class="country-tag">'+flag(first.country||'Global')+' '+esc(first.country||'Global')+'</span><h1>'+esc(first.headline)+'</h1><p>'+esc(first.summary||'')+'</p><button class="read" data-open="'+esc(first.id)+'">Read full story →</button></div>':'';
    var list=(mode==='home'&&!q.value.trim())?d.slice(1):d;
    if(mode==='home')listTitle.textContent='Top Stories · Worldwide';else if(mode==='country')listTitle.textContent=flag(selectedCountry)+' '+selectedCountry+' Stories';else if(mode==='region')listTitle.textContent=region+' Stories';else listTitle.textContent=category+' Stories';
    count.textContent=d.length+' stories';
    if(!list.length){grid.innerHTML='<div class="empty"><h3>No stories found</h3><p>Try another region, country, category or search term.</p></div>';return;}
    grid.innerHTML=list.map(function(s){return '<article class="card"><div class="label-row">'+badge(s.verification_status)+'<span class="pill">'+(s.source_count||0)+' source'+((s.source_count||0)===1?'':'s')+'</span><span class="country-tag">'+flag(s.country||'Global')+' '+esc(s.country||'Global')+'</span></div><h3>'+esc(s.headline)+'</h3><p style="font-size:12px;color:#667085">'+esc(s.category||'General')+'</p><p>'+esc(s.summary||'')+'</p><button class="read" data-open="'+esc(s.id)+'">Read story →</button></article>';}).join('');
  }
  async function load(){
    try{
      var r=await api('news_stories?status=in.(verified,published,corrected,developing)&select=id,slug,headline,summary,body,category,country,status,verification_status,source_count,correction_notice,published_at,created_at,updated_at&order=published_at.desc.nullslast,created_at.desc');
      if(!r.ok)throw new Error('Supabase '+r.status);
      var data=await r.json();stories=Array.isArray(data)?data:[];
      state.innerHTML='<span class="dot"></span>Supabase connected';notice.textContent='Live news · '+stories.length+' stories available';render();
    }catch(e){console.error('Global News load error',e);state.textContent='Connection error';notice.textContent='News feed could not be loaded. Explorer remains available.';notice.className='notice error';render();}
  }
  async function openStory(id){
    try{
      var r=await api('news_stories?id=eq.'+encodeURIComponent(id)+'&select=*');if(!r.ok)return;var data=await r.json();var s=data[0];if(!s)return;
      var sr=await api('news_sources?story_id=eq.'+encodeURIComponent(id)+'&select=publisher,url,title,excerpt&order=created_at.asc');var sources=sr.ok?await sr.json():[];
      var text=s.summary||s.body||s.headline;var points=text.split(/[.!?]\s+/).filter(function(x){return x.length>30;}).slice(0,5);
      article.innerHTML='<div class="story-card"><div class="story-head"><div class="label-row">'+badge(s.verification_status)+'<span class="pill">'+(s.source_count||sources.length||0)+' sources</span><span class="pill">'+esc(s.category||'General')+'</span><span class="country-tag">'+flag(s.country||'Global')+' '+esc(s.country||'Global')+'</span></div><h1>'+esc(s.headline)+'</h1><p class="lead">'+esc(s.summary||s.body||'')+'</p></div><section class="story-section"><h2>Story brief</h2><div class="brief"><ul>'+((points.length?points:[text]).map(function(x){return '<li>'+esc(x)+'</li>';}).join(''))+'</ul></div></section><section class="story-section"><h2>What the sources report</h2><div class="source-grid">'+(sources.length?sources.map(function(x){return '<div class="source-card"><div class="publisher">'+esc(x.publisher||'Source')+'</div><div class="title">'+esc(x.title||'Original report')+'</div>'+(x.excerpt?'<div class="excerpt">'+esc(x.excerpt)+'</div>':'')+'<a href="'+esc(x.url||'#')+'" target="_blank" rel="noopener">Open original source →</a></div>';}).join(''):'<div class="count">Source details unavailable.</div>')+'</div></section><div class="verify"><strong>Verification:</strong> '+esc(s.verification_status||'unverified')+'. '+(((s.source_count||sources.length||0)<2)?'Single-source report; not independently corroborated.':'Multiple source records attached.')+'</div></div>';
      home.classList.add('hidden');detail.classList.remove('hidden');window.scrollTo(0,0);
    }catch(e){console.error('Story open error',e);}
  }
  nav.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var m=b.getAttribute('data-mode'),cat=b.getAttribute('data-cat');if(m==='home'){q.value='';setRegion('All');}else if(m==='country'){q.value='';setCountry(selectedCountry==='All'?detect():selectedCountry);}else if(cat){q.value='';mode='category';category=cat;selectedCountry='All';region='All';countrySearch.value='';renderExplorer();render();}window.scrollTo(0,0);});
  regionsEl.addEventListener('click',function(e){var b=e.target.closest('[data-region]');if(b)setRegion(b.getAttribute('data-region'));});
  countryRow.addEventListener('click',function(e){var b=e.target.closest('[data-country]');if(b)setCountry(b.getAttribute('data-country'));});
  countrySearch.addEventListener('change',function(){setCountry(countrySearch.value.trim());});
  countrySearch.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();setCountry(countrySearch.value.trim());}});
  $('countryClear').addEventListener('click',function(){setRegion('All');});
  $('search').addEventListener('click',render);q.addEventListener('keydown',function(e){if(e.key==='Enter')render();});
  document.addEventListener('click',function(e){var b=e.target.closest('[data-open]');if(b)openStory(b.getAttribute('data-open'));});
  $('back').addEventListener('click',function(){detail.classList.add('hidden');home.classList.remove('hidden');});
  var initial=detect();myCountry.textContent=flag(initial)+' '+initial;
  renderExplorer();
  render();
  load();
})();
</script>
</body>
</html>
