<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global News</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fa;color:#111827}header{background:#111827;color:#fff;padding:16px 18px}.bar,main{max-width:1180px;margin:auto}.bar{display:flex;align-items:center}.brand{font-weight:800;font-size:20px;margin-right:auto}.state{font-size:12px;color:#cbd5e1}nav{background:#fff;border-bottom:1px solid #e5e7eb;overflow:auto}.nav{display:flex;gap:4px;padding:8px 12px}.nav button{border:0;background:#fff;padding:9px 11px;border-radius:8px;white-space:nowrap;cursor:pointer}.nav .active{background:#e8edff}main{padding:20px}.search{display:flex;gap:8px}.search input{flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.search button,.read,.back{border:0;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}.explorer{margin-top:14px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.explorer-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.explorer-head h3{margin:0}.region-row{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.region-row button,.country{border:1px solid #dbe1ea;background:#fff;padding:7px 10px;border-radius:999px;cursor:pointer}.region-row button.active,.country.active{background:#e8edff;border-color:#b8c5f5}.country-search{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px}.country-grid{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;max-height:150px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}.hero,.card,.article{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:19px;margin-top:18px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:800}.badge.developing{background:#fff7ed;color:#c2410c}.badge.unverified{background:#f3f4f6;color:#4b5563}.badge.disputed,.badge.fake,.badge.false{background:#fef2f2;color:#b91c1c}.badge.corrected{background:#f3e8ff;color:#7e22ce}.meta{color:#6b7280;font-size:13px}.notice{margin-top:12px;padding:10px;border-radius:8px;background:#eef2ff;font-size:13px}.error{background:#fff7ed;color:#9a3412}.article{max-width:820px}.hidden{display:none}.source-list{margin-top:20px;border-top:1px solid #e5e7eb;padding-top:14px}.source{padding:10px 0;border-bottom:1px solid #f0f1f3}.source a{color:#2563eb;text-decoration:none}.label-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}.empty-state{grid-column:1/-1;padding:30px;text-align:center;color:#6b7280}.small{font-size:12px;color:#6b7280}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}.hero h1{font-size:26px}.search{flex-direction:column}.search button{width:100%}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">GLOBAL NEWS</div><div id="state" class="state">Starting…</div></div></header>
<nav><div class="bar nav" id="nav">
<button data-cat="Home" class="active">Home</button><button data-cat="India">India</button><button data-cat="World">World</button><button data-cat="Geopolitics">Geopolitics</button><button data-cat="International Relations">International Relations</button><button data-cat="Business">Business</button><button data-cat="Technology">Technology</button><button data-cat="Entertainment">Entertainment</button><button data-cat="Sports">Sports</button><button data-cat="Science">Science</button><button data-cat="Climate">Climate</button>
</div></nav>
<main>
<section id="home">
<div class="search"><input id="q" placeholder="Search global stories…"><button id="search">Search</button></div>
<div class="explorer">
<div class="explorer-head"><h3>🌍 Explore Worldwide</h3><span class="small">Country and region coverage</span></div>
<div class="region-row" id="regions"></div>
<input id="countrySearch" class="country-search" placeholder="Search any country…">
<div id="countries" class="country-grid"></div>
</div>
<div id="notice" class="notice">Loading live news…</div><div id="hero"></div><h2 id="listTitle">Top Stories</h2><div id="grid" class="grid"></div>
</section>
<section id="detail" class="hidden"><button id="back" class="back">← Back</button><div id="article" class="article"></div></section>
</main>
<script>
(() => {
let category="Home",stories=[],region="All",country="All";
const regions={"All":["All"],"Asia":["India","China","Japan","South Korea","Indonesia","Singapore","Thailand","Vietnam","Malaysia","Philippines","Pakistan","Bangladesh","Sri Lanka","Nepal"],"Europe":["United Kingdom","France","Germany","Italy","Spain","Portugal","Netherlands","Belgium","Switzerland","Sweden","Norway","Denmark","Finland","Poland","Ukraine","Russia","European Union"],"North America":["United States","Canada","Mexico"],"South America":["Brazil","Argentina","Chile","Colombia","Peru","Venezuela","Ecuador","Bolivia","Uruguay","Paraguay"],"Middle East":["Saudi Arabia","United Arab Emirates","Israel","Iran","Iraq","Qatar","Kuwait","Oman","Jordan","Egypt","Türkiye"],"Africa":["South Africa","Nigeria","Kenya","Ethiopia","Ghana","Morocco","Algeria","Tunisia","Tanzania","Uganda","Zimbabwe"],"Oceania":["Australia","New Zealand","Fiji","Papua New Guinea"]};
const allCountries=[...new Set(Object.values(regions).flat())].filter(x=>x!=="All").sort();
const nav=document.querySelector("#nav"),grid=document.querySelector("#grid"),hero=document.querySelector("#hero"),notice=document.querySelector("#notice"),q=document.querySelector("#q"),state=document.querySelector("#state"),listTitle=document.querySelector("#listTitle"),home=document.querySelector("#home"),detail=document.querySelector("#detail"),article=document.querySelector("#article"),regionsEl=document.querySelector("#regions"),countriesEl=document.querySelector("#countries"),countrySearch=document.querySelector("#countrySearch");
const showError=(message)=>{state.textContent="● UI error";notice.textContent=message;notice.className="notice error"};
window.addEventListener("error",e=>showError("Page script error: "+(e.message||"unknown error")));
function badge(s){const v=(s||"unverified").toLowerCase().replace(/\s+/g,"-");return `<span class="badge ${v}">${v.replace("-"," ").toUpperCase()}</span>`}
function renderExplorer(){regionsEl.innerHTML=Object.keys(regions).map(r=>`<button data-region="${r}" class="${r===region?"active":""}">${r}</button>`).join("");const term=countrySearch.value.trim().toLowerCase();const list=(region==="All"?allCountries:regions[region]).filter(c=>!term||c.toLowerCase().includes(term));countriesEl.innerHTML=list.map(c=>`<button class="country ${c===country?"active":""}" data-country="${c}">${c}</button>`).join("")}
function api(path){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);return fetch(path,{headers:{Accept:"application/json"},signal:controller.signal}).finally(()=>clearTimeout(timer))}
function normalize(payload){if(Array.isArray(payload))return payload;if(Array.isArray(payload?.stories))return payload.stories;if(Array.isArray(payload?.data))return payload.data;return []}
function render(){nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.cat===category));let data=category==="Home"?stories:stories.filter(s=>(s.category||"").toLowerCase()===category.toLowerCase());if(country!=="All")data=data.filter(s=>(s.country||s.country_code||s.region||"").toLowerCase()===country.toLowerCase());const term=q.value.trim().toLowerCase();if(term)data=data.filter(s=>(s.headline+" "+(s.summary||"")+" "+(s.category||"")+" "+(s.country||"")).toLowerCase().includes(term));const h=category==="Home"&&!term&&country==="All"?data[0]:null;hero.innerHTML=h?`<div class="hero">${badge(h.verification_status)} <span class="pill">${h.source_count||0} sources</span><h1>${h.headline}</h1><p>${h.summary||""}</p><button class="read" data-open="${h.id}">Read full story →</button></div>`:"";const a=(category==="Home"&&!term&&country==="All")?data.slice(1):data;listTitle.textContent=country!=="All"?country+" Stories":(category==="Home"?"Top Stories":category+" Stories");if(!a.length){grid.innerHTML='<div class="empty-state"><h3>No stories found</h3><p>This does not mean the country is unsupported — the live feed may not yet have stories for this filter.</p></div>';return}grid.innerHTML=a.map(s=>`<article class="card">${badge(s.verification_status)} <span class="pill">${s.source_count||0} sources</span><h3>${s.headline}</h3><p class="meta">${s.category||"General"}${s.country?" · "+s.country:""}</p><p>${s.summary||""}</p><button class="read" data-open="${s.id}">Read story →</button></article>`).join("")}
async function load(){try{const r=await api("/api/news");if(!r.ok){const t=await r.text();throw Error("News API "+r.status+(t?": "+t.slice(0,140):"))}stories=normalize(await r.json());state.textContent="● Global News API connected";notice.textContent=`Live news API · ${stories.length} stories available`;notice.className="notice";render()}catch(e){showError(e.name==="AbortError"?"News API timed out. Please refresh once.":(e.message||"News API could not be reached."));grid.innerHTML="";hero.innerHTML=""}}
async function openStory(id){try{const r=await api("/api/news?id="+encodeURIComponent(id));if(!r.ok)throw Error("Story request failed: "+r.status);const payload=await r.json();const rows=normalize(payload),s=rows[0]||payload.story;if(!s)throw Error("Story not found");let sources=Array.isArray(s.sources)?s.sources:[];article.innerHTML=`<div class="label-row">${badge(s.verification_status)}<span class="pill">${s.source_count||sources.length||0} sources</span><span class="pill">${s.category||"General"}</span>${s.country?`<span class="pill">${s.country}</span>`:""}</div><h1>${s.headline}</h1><p class="meta">Last updated ${s.updated_at?new Date(s.updated_at).toLocaleString():"—"}</p><div>${s.body||s.summary||""}</div>${s.correction_notice?`<p><strong>Correction:</strong> ${s.correction_notice}</p>`:""}<div class="source-list"><h3>Sources & attribution</h3>${sources.length?sources.map(x=>`<div class="source"><strong>${x.publisher||"Source"}</strong><br><span class="meta">${x.title||"Original report"}</span><br><a href="${x.url}" target="_blank" rel="noopener noreferrer">Open original source →</a></div>`).join(""):"<p class="meta">Source details will appear as provenance is attached.</p>"}</div>`;home.classList.add("hidden");detail.classList.remove("hidden");scrollTo(0,0)}catch(e){showError(e.message||"Could not open story")}}
function backHome(){detail.classList.add("hidden");home.classList.remove("hidden")}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-cat]");if(!b)return;category=b.dataset.cat;q.value="";detail.classList.add("hidden");home.classList.remove("hidden");render();scrollTo(0,0)});
regionsEl.addEventListener("click",e=>{const b=e.target.closest("button[data-region]");if(!b)return;region=b.dataset.region;country="All";renderExplorer();render()});countriesEl.addEventListener("click",e=>{const b=e.target.closest("button[data-country]");if(!b)return;country=b.dataset.country;renderExplorer();render()});countrySearch.addEventListener("input",renderExplorer);document.addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b)openStory(b.dataset.open)});document.querySelector("#search").onclick=render;q.onkeydown=e=>{if(e.key==="Enter")render()};document.querySelector("#back").onclick=backHome;renderExplorer();load();
})();
</script>
</body></html>
