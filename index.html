<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI News Platform</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fa;color:#111827}
header{background:#111827;color:#fff;padding:16px 18px}.bar,main{max-width:1100px;margin:auto}.bar{display:flex;align-items:center}.brand{font-weight:800;font-size:20px;margin-right:auto}.state{font-size:12px;color:#cbd5e1}
nav{background:#fff;border-bottom:1px solid #e5e7eb;overflow:auto}.nav{display:flex;gap:4px;padding:8px 12px}.nav button{border:0;background:#fff;padding:9px 11px;border-radius:8px;white-space:nowrap;cursor:pointer}.nav .active{background:#e8edff}
main{padding:20px}.search{display:flex;gap:8px}.search input{flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.search button,.read,.back{border:0;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}.hero,.card,.article{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:19px;margin-top:18px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:800}.meta{color:#6b7280;font-size:13px}
.notice{margin-top:12px;padding:10px;border-radius:8px;background:#eef2ff;font-size:13px}.error{background:#fff7ed;color:#9a3412}.article{max-width:820px}.hidden{display:none}
@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}.hero h1{font-size:26px}.search{flex-direction:column}.search button{width:100%}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">GLOBAL NEWS</div><div id="state" class="state">Connecting…</div></div></header>
<nav><div class="bar nav" id="nav"></div></nav>
<main>
<section id="home">
<div class="search"><input id="q" placeholder="Search verified stories…"><button id="search">Search</button></div>
<div id="notice" class="notice">Connecting to Supabase…</div>
<div id="hero"></div><h2 id="listTitle">Top Stories</h2><div id="grid" class="grid"></div>
</section>
<section id="detail" class="hidden"><button id="back" class="back">← Back</button><div id="article" class="article"></div></section>
</main>
<script>
const SUPABASE_URL="https://nfqwnrmwyhcycjsfwqfl.supabase.co";
const SUPABASE_KEY="sb_publishable_FXSeGzRWwQ3FbyBWf_z80g_DHlcLcCl";
const C=["Home","India","World","Geopolitics","International Relations","Business","Technology"];
let category="Home",stories=[];
const nav=document.querySelector("#nav"),grid=document.querySelector("#grid"),hero=document.querySelector("#hero"),notice=document.querySelector("#notice"),q=document.querySelector("#q"),state=document.querySelector("#state"),listTitle=document.querySelector("#listTitle");
nav.innerHTML=C.map(c=>`<button data-cat="${c}" class="${c===category?"active":""}">${c}</button>`).join("");
function api(path){return fetch(SUPABASE_URL+"/rest/v1/"+path,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}})}
async function load(){
 try{
  const r=await api("news_stories?status=in.(verified,published,corrected)&select=id,slug,headline,summary,body,category,status,verification_status,source_count,correction_notice,published_at,created_at,updated_at&order=published_at.desc.nullslast,created_at.desc");
  if(!r.ok)throw Error("Supabase "+r.status);
  stories=await r.json();state.textContent="● Supabase connected";notice.textContent=`Live Supabase data · ${stories.length} published/verified stories`;notice.className="notice";render();
 }catch(e){state.textContent="● Connection error";notice.textContent="Supabase could not be reached.";notice.className="notice error";grid.innerHTML="";hero.innerHTML=""}
}
function render(){
 nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.cat===category));
 let data=category==="Home"?stories:stories.filter(s=>s.category===category);
 const term=q.value.trim().toLowerCase();if(term)data=data.filter(s=>(s.headline+" "+(s.summary||"")+" "+s.category).toLowerCase().includes(term));
 const h=category==="Home"&&!term?data[0]:null;
 hero.innerHTML=h?`<div class="hero"><span class="badge">${h.verification_status.toUpperCase()} · ${h.source_count} SOURCES</span><h1>${h.headline}</h1><p>${h.summary||""}</p><button class="read" data-open="${h.id}">Read full story →</button></div>`:"";
 const a=h?data.slice(1):data;
 listTitle.textContent=h&&a.length===0?"Latest Story":(category==="Home"?"Top Stories":category+" Stories");if(!a.length){grid.innerHTML='<div class="empty-state"><h3>No stories found</h3><p>Try another search term or select a different category.</p></div>';return;}
 grid.innerHTML=a.length?a.map(s=>`<article class="card"><span class="badge">${s.verification_status.toUpperCase()} · ${s.source_count} SOURCES</span><h3>${s.headline}</h3><p class="meta">${s.category}</p><p>${s.summary||""}</p><button class="read" data-open="${s.id}">Read story →</button></article>`).join(""):"";
}
async function openStory(id){
 const r=await api("news_stories?id=eq."+encodeURIComponent(id)+"&select=*");if(!r.ok)return;
 const rows=await r.json(),s=rows[0];if(!s)return;
 article.innerHTML=`<p><span class="badge">${s.verification_status.toUpperCase()} · ${s.source_count} SOURCES</span></p><h1>${s.headline}</h1><p class="meta">${s.category}</p><div>${s.body||s.summary||""}</div>${s.correction_notice?`<p><strong>Correction:</strong> ${s.correction_notice}</p>`:""}`;
 home.classList.add("hidden");detail.classList.remove("hidden");scrollTo(0,0);
}
function backHome(){detail.classList.add("hidden");home.classList.remove("hidden")}
document.addEventListener("click",e=>{if(e.target.dataset.cat){category=e.target.dataset.cat;q.value="";detail.classList.add("hidden");home.classList.remove("hidden");render();scrollTo(0,0)}if(e.target.dataset.open)openStory(e.target.dataset.open)});
document.querySelector("#search").onclick=render;q.onkeydown=e=>{if(e.key==="Enter")render()};back.onclick=backHome;load();
</script>
</body></html>
