<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI News Platform</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#172033}header{position:sticky;top:0;z-index:10;background:#10182b;color:white;border-bottom:1px solid #26314b}.bar{max-width:1280px;margin:auto;padding:14px 22px;display:flex;gap:18px;align-items:center}.brand{font-weight:800;font-size:21px;white-space:nowrap}.nav{display:flex;gap:4px;overflow:auto;flex:1}.nav button,.lang,button{font:inherit}.nav button{background:transparent;border:0;color:#d9e1f2;padding:9px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}.nav button.active,.nav button:hover{background:#26314b;color:white}.lang{background:#fff;color:#172033;border-radius:8px;border:0;padding:8px;max-width:150px}.wrap{max-width:1280px;margin:auto;padding:30px 22px}.hero{background:linear-gradient(135deg,#111c34,#263d70);color:white;border-radius:20px;padding:34px;margin-bottom:28px}.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,48px)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e2e6ef;border-radius:16px;padding:20px;box-shadow:0 3px 14px #1720330d}.tag{font-size:12px;font-weight:700;color:#53627d;text-transform:uppercase;letter-spacing:.06em}.card h2{font-size:20px;line-height:1.3;margin:9px 0}.card p{color:#5d687c;line-height:1.55}.card button{background:#152343;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.reader{display:none}.reader.show{display:block}.back{margin-bottom:20px;background:white;border:1px solid #dce2ec;padding:9px 14px;border-radius:8px;cursor:pointer}.story{background:white;border:1px solid #e2e6ef;border-radius:18px;padding:clamp(20px,4vw,46px)}.story h1{font-size:clamp(28px,4vw,48px);line-height:1.15}.tabs{display:flex;gap:8px;border-bottom:1px solid #e4e8f0;margin:22px 0 20px}.tabs button{border:0;background:none;padding:12px 16px;cursor:pointer;font-weight:700;color:#667085}.tabs button.active{color:#18284a;border-bottom:3px solid #18284a}.panel{display:none;line-height:1.75;color:#3e4b62}.panel.active{display:block}.panel h3{color:#18284a}.reader-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid #e4e8f0}.reader-nav button{background:#eef2f8;border:0;padding:9px 12px;border-radius:8px;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.bar{padding:12px}.brand{font-size:17px}.wrap{padding:20px 14px}}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{padding:24px 20px}.lang{max-width:110px}.nav button{padding:8px}.story{padding:22px 17px}}
</style></head><body><header><div class="bar"><div class="brand" data-i18n="brand">AI News Platform</div><nav class="nav" id="nav"></nav><select class="lang" id="lang" aria-label="Language"></select></div></header><main class="wrap"><section id="home"><div class="hero"><h1 data-i18n="heroTitle">AI-powered global news, explained clearly</h1><p data-i18n="heroText">Explore important developments across the world with concise briefs and deeper reports.</p></div><div class="grid" id="grid"></div></section><section class="reader" id="reader"><button class="back" id="back">← <span data-i18n="back">Back to news</span></button><article class="story"><div class="tag" id="storyTag"></div><h1 id="storyTitle"></h1><div class="tabs"><button class="active" data-panel="brief" data-i18n="storyBrief">Story Brief</button><button data-panel="report" data-i18n="fullReport">Full Report</button></div><div class="panel active" id="brief"></div><div class="panel" id="report"></div><div class="reader-nav" id="readerNav"></div></article></section></main><script>
const DATA={Home:[['Global markets digest','Markets are balancing growth expectations, inflation signals and policy decisions.'],['AI regulation moves forward','Governments are refining rules for safety, transparency and responsible innovation.'],['Climate transition accelerates','Investment and policy are reshaping energy systems and industrial strategy.']],Geopolitics:[['Diplomatic shifts reshape alliances','Regional partnerships and strategic negotiations are influencing the global balance of power.'],['Trade corridors gain importance','Infrastructure and supply chains are becoming central to geopolitical strategy.'],['Security dialogue expands','Countries are combining diplomacy, technology and economic tools to manage risks.']],Technology:[['AI models become more capable','Competition is driving rapid progress in multimodal systems, agents and infrastructure.'],['Semiconductors remain strategic','Compute demand is reshaping investment across the global chip ecosystem.'],['Cyber resilience rises','Organizations are prioritizing secure architecture and faster incident response.']],Business:[['Companies adapt to new growth cycle','Leaders are balancing efficiency, innovation and long-term investment.'],['Energy transition creates opportunities','Capital is moving toward electrification, storage and cleaner industrial systems.'],['Consumer trends keep evolving','Digital behaviour and value expectations continue to reshape markets.']],Science:[['Space research enters a new phase','Scientific missions are expanding knowledge while commercial activity grows.'],['Health innovation advances','Data, AI and biotechnology are accelerating research and development.'],['Climate science improves forecasting','Better models help governments and businesses prepare for changing conditions.']]};
const translations={en:{brand:'AI News Platform',heroTitle:'AI-powered global news, explained clearly',heroText:'Explore important developments across the world with concise briefs and deeper reports.',back:'Back to news',storyBrief:'Story Brief',fullReport:'Full Report',read:'Full Read Story'},hi:{brand:'AI समाचार प्लेटफ़ॉर्म',heroTitle:'AI-संचालित वैश्विक समाचार, स्पष्ट रूप से',heroText:'संक्षिप्त सार और विस्तृत रिपोर्ट के साथ दुनिया की महत्वपूर्ण घटनाओं को समझें।',back:'समाचार पर वापस',storyBrief:'स्टोरी सार',fullReport:'विस्तृत रिपोर्ट',read:'पूरी स्टोरी पढ़ें'},es:{brand:'Plataforma de Noticias de IA',heroTitle:'Noticias globales impulsadas por IA, explicadas con claridad',heroText:'Explora los acontecimientos importantes del mundo con resúmenes y reportes detallados.',back:'Volver a noticias',storyBrief:'Resumen',fullReport:'Informe completo',read:'Leer historia completa'},fr:{brand:'Plateforme d’actualités IA',heroTitle:'L’actualité mondiale propulsée par l’IA, expliquée clairement',heroText:'Découvrez les événements importants avec des résumés et des rapports détaillés.',back:'Retour aux actualités',storyBrief:'Résumé',fullReport:'Rapport complet',read:'Lire l’article'},de:{brand:'KI-Nachrichtenplattform',heroTitle:'KI-gestützte Weltnachrichten, klar erklärt',heroText:'Entdecken Sie wichtige Entwicklungen mit Kurzfassungen und ausführlichen Berichten.',back:'Zurück zu Nachrichten',storyBrief:'Kurzfassung',fullReport:'Vollständiger Bericht',read:'Ganze Story lesen'},pt:{brand:'Plataforma de Notícias com IA',heroTitle:'Notícias globais com IA, explicadas claramente',heroText:'Explore acontecimentos importantes com resumos e relatórios detalhados.',back:'Voltar às notícias',storyBrief:'Resumo',fullReport:'Relatório completo',read:'Ler matéria completa'},ar:{brand:'منصة أخبار الذكاء الاصطناعي',heroTitle:'أخبار عالمية مدعومة بالذكاء الاصطناعي ومشروحة بوضوح',heroText:'استكشف أهم التطورات العالمية مع ملخصات وتقارير معمقة.',back:'العودة للأخبار',storyBrief:'ملخص القصة',fullReport:'التقرير الكامل',read:'قراءة القصة كاملة'},zh:{brand:'AI 新闻平台',heroTitle:'AI 驱动的全球新闻，清晰解读',heroText:'通过简明摘要和深度报告了解全球重要动态。',back:'返回新闻',storyBrief:'新闻摘要',fullReport:'完整报道',read:'阅读全文'},ja:{brand:'AIニュースプラットフォーム',heroTitle:'AIが支える世界のニュースを分かりやすく解説',heroText:'要約と詳細レポートで世界の重要な出来事を確認できます。',back:'ニュースに戻る',storyBrief:'ニュース要約',fullReport:'詳細レポート',read:'全文を読む'},ko:{brand:'AI 뉴스 플랫폼',heroTitle:'AI 기반 글로벌 뉴스를 명확하게 설명합니다',heroText:'간결한 요약과 상세 보고서로 중요한 세계 뉴스를 살펴보세요.',back:'뉴스로 돌아가기',storyBrief:'스토리 요약',fullReport:'전체 보고서',read:'전체 기사 읽기'},ru:{brand:'Платформа новостей ИИ',heroTitle:'Мировые новости на базе ИИ — понятно и ясно',heroText:'Изучайте важные события с краткими обзорами и подробными отчетами.',back:'Назад к новостям',storyBrief:'Кратко',fullReport:'Полный отчет',read:'Читать полностью'},id:{brand:'Platform Berita AI',heroTitle:'Berita global berbasis AI, dijelaskan dengan jelas',heroText:'Jelajahi perkembangan penting dunia dengan ringkasan dan laporan mendalam.',back:'Kembali ke berita',storyBrief:'Ringkasan Berita',fullReport:'Laporan Lengkap',read:'Baca Selengkapnya'}};
const languages=[['en','English'],['hi','हिन्दी'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português'],['ar','العربية'],['zh','中文'],['ja','日本語'],['ko','한국어'],['ru','Русский'],['id','Bahasa Indonesia']];let category='Home',lang='en';const nav=document.getElementById('nav'),grid=document.getElementById('grid'),reader=document.getElementById('reader'),home=document.getElementById('home');
function t(k){return translations[lang][k]||translations.en[k]||k}function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));renderNav();renderGrid();document.getElementById('lang').value=lang}
function renderNav(){nav.innerHTML='';Object.keys(DATA).forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;home.style.display='block';reader.classList.remove('show');renderNav();renderGrid();window.scrollTo({top:0,behavior:'smooth'})};nav.appendChild(b)})}
function renderGrid(){grid.innerHTML='';DATA[category].forEach((s,i)=>{let d=document.createElement('article');d.className='card';d.innerHTML='<div class="tag">'+category+'</div><h2>'+s[0]+'</h2><p>'+s[1]+'</p><button>'+t('read')+'</button>';d.querySelector('button').onclick=()=>openStory(category,i);grid.appendChild(d)})}
function openStory(c,i){const s=DATA[c][i];document.getElementById('storyTag').textContent=c;document.getElementById('storyTitle').textContent=s[0];document.getElementById('brief').innerHTML='<h3>'+t('storyBrief')+'</h3><p>'+s[1]+'</p><p>This concise view highlights the core development, why it matters and the main point to remember.</p>';document.getElementById('report').innerHTML='<h3>'+t('fullReport')+'</h3><p>'+s[1]+'</p><p>The full report provides broader context, contributing factors, possible implications and the issues that should be watched next. It is intentionally more detailed than the Story Brief rather than repeating the same text.</p><h3>Context and implications</h3><p>Developments in this area connect policy, technology, markets and public outcomes. The significance can evolve as new information becomes available.</p>';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.panel==='brief'));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='brief'));const rn=document.getElementById('readerNav');rn.innerHTML='';Object.keys(DATA).filter(x=>x!==c).forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{category=x;home.style.display='block';reader.classList.remove('show');renderNav();renderGrid();window.scrollTo({top:0,behavior:'smooth'})};rn.appendChild(b)});home.style.display='none';reader.classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.panel))});document.getElementById('back').onclick=()=>{reader.classList.remove('show');home.style.display='block';window.scrollTo({top:0,behavior:'smooth'})};const sel=document.getElementById('lang');languages.forEach(([v,n])=>{let o=document.createElement('option');o.value=v;o.textContent=n;sel.appendChild(o)});sel.onchange=e=>{lang=e.target.value;apply()};apply();
</script></body></html>
