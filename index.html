<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global News</title><style>:root{--n:#101828;--i:#172033;--m:#667085;--l:#d9e1ec;--s:#ff9933;--g:#138808}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--i);font:15px/1.55 Inter,system-ui}.top{background:var(--n);border-top:4px solid var(--s);border-bottom:4px solid var(--g)}.shell{max-width:1240px;margin:auto;padding:0 20px}.topin{height:70px;display:flex;align-items:center;gap:16px}.brand{color:#fff;font-size:24px;font-weight:900}.brand b{color:#9bbcff}.sp{margin-left:auto}.lang{height:38px;background:#172234;color:#fff;border:1px solid #475467;border-radius:9px;padding:0 10px;font-weight:700}.nav{background:#fff;border-bottom:1px solid var(--l)}.navin{display:flex;gap:4px;overflow:auto;padding:9px 0}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:9px;font-weight:700;white-space:nowrap;color:#475467}.nav button.active{background:#eaf1ff;color:#194185}.page{padding:24px 0 56px}.search{display:flex;gap:10px}.search input{flex:1;height:50px;border:1px solid #cbd5e1;border-radius:12px;padding:0 15px;font:inherit}.btn,.read{border:0;border-radius:10px;background:var(--n);color:#fff;padding:0 18px;font-weight:800;cursor:pointer}.notice{margin-top:14px;border:1px solid #cfe0fb;background:#edf4ff;border-radius:10px;padding:9px 12px;font-size:13px}.hero{margin-top:16px;padding:30px;border-radius:20px;background:linear-gradient(135deg,#101828,#243247);color:#fff}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#eef2f7;color:#344054;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.hero h1{font-size:34px;line-height:1.18;margin:16px 0 10px}.hero p{color:#d8e1ec}.hero .read{background:#fff;color:var(--i);height:40px}.explore,.card,.article{background:#fff;border:1px solid var(--l);border-radius:16px}.explore{margin-top:18px;padding:16px}.exploretop{display:flex;gap:12px;align-items:center}.exploretitle{font-weight:900}.sub{font-size:12px;color:var(--m)}.country{margin-left:auto;display:flex;gap:7px;align-items:center;font-size:12px;font-weight:800}.country select{width:260px;height:40px;border:1px solid #cbd5e1;border-radius:9px;padding:0 10px}.regions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.regions button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:6px 10px;font-size:11px}.regions button.active{background:#eaf1ff;color:#194185}.head{display:flex;justify-content:space-between;align-items:end;margin-top:28px}.head h2{margin:0;font-size:23px}.count{font-size:12px;color:var(--m)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.card{padding:18px;min-height:250px;display:flex;flex-direction:column}.card h3{font-size:18px;line-height:1.3;margin:14px 0 9px}.card p{color:#475467;margin:0}.card .read{height:38px;margin-top:auto;align-self:start}.hidden{display:none}.detail{max-width:980px;margin:auto}.back{height:38px;background:#fff;border:1px solid #cbd5e1;border-radius:9px;padding:0 14px;font-weight:800;margin-bottom:18px}.article{padding:34px}.article h1{font-size:38px;line-height:1.15}.lead{font-size:17px;color:#475467}.section{margin-top:30px}.footer{border-top:1px solid var(--l);padding:20px 0;color:#98a2b3;font-size:11px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{padding:0 12px}.topin{height:60px}.search{flex-direction:column}.btn{height:46px}.exploretop{flex-wrap:wrap}.country{margin-left:0;width:100%}.country select{flex:1}.grid{grid-template-columns:1fr}.article{padding:20px}.article h1{font-size:29px}.hero{padding:22px}.hero h1{font-size:28px}}</style><body><header class="top"><div class="shell topin"><div class="brand">GLOBAL <b>NEWS</b></div><div class="sp"></div><span style="color:#d7e2f0;font-size:12px">● API connected</span><select id="lang" class="lang"></select></div></header><nav class="nav"><div class="shell navin" id="nav"></div></nav><main class="shell page"><section id="home"><div class="search"><input id="q"><button class="btn" id="searchBtn">Search</button></div><div id="notice" class="notice"></div><div id="hero"></div><div class="explore"><div class="exploretop"><div class="exploretitle">🌍 Explore Worldwide <span class="sub">Regions & countries</span></div><div class="country">Country <select id="country"></select></div></div><div id="regions" class="regions"></div></div><div class="head"><h2 id="listTitle">Top Stories · Worldwide</h2><span id="count" class="count"></span></div><div id="grid" class="grid"></div></section><section id="detail" class="hidden detail"></section></main><footer class="footer"><div class="shell">Global News · Source attribution and provenance preserved · Worldwide coverage</div></footer><script>(()=>{const SB='https://nfqwnrmwyhcycjsfwqfl.supabase.co',KEY='sb_publishable_FXSeGzRWwQ3FbyBWf_z80g_DHlcLcCl',CATS=['Home','In India','India','World','Geopolitics','International Relations','Business','Technology','Entertainment','Sports','Science','Climate'],REG={All:[],Asia:['India','China','Japan','South Korea','Indonesia','Pakistan','Bangladesh'],Europe:['United Kingdom','France','Germany','Italy','Spain','Ukraine','Russia'],Africa:['South Africa','Nigeria','Kenya','Egypt'],Americas:['United States','Canada','Mexico','Brazil','Argentina'],MiddleEast:['Saudi Arabia','United Arab Emirates','Israel','Iran','Qatar'],Oceania:['Australia','New Zealand']},LANG={en:'English',hi:'हिंदी',zh:'中文',es:'Español',ar:'العربية',fr:'Français',bn:'বাংলা',pt:'Português',ru:'Русский',ur:'اردو',id:'Bahasa Indonesia'};let lang=localStorage.gn_lang||'en',stories=[],cat='Home',region='All',selected='All';const $=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=x=>String(x||'').toLowerCase();$('#lang').innerHTML=Object.entries(LANG).map(([k,v])=>`<option ${k==lang?'selected':''} value="${k}">${v}</option>`).join('');function chips(s){return `<div class="chips"><span class="chip">${esc((s.verification_status||'unverified').toUpperCase())}</span><span class="chip">${esc(s.source_count||0)} sources</span><span class="chip">${esc(s.country||'Global')}</span></div>`}function nav(){ $('#nav').innerHTML=CATS.map(x=>`<button data-cat="${x}" class="${x==cat?'active':''}">${x}</button>`).join('');$('#nav').onclick=e=>{let b=e.target.closest('[data-cat]');if(!b)return;$('#detail').classList.add('hidden');$('#home').classList.remove('hidden');cat=b.dataset.cat;selected='All';render();scrollTo(0,0)}}function countries(){let a=region==='All'?[...new Set(stories.map(x=>x.country).filter(Boolean))].sort():REG[region];$('#country').innerHTML='<option value="All">Search or select country…</option>'+a.map(x=>`<option ${x==selected?'selected':''}>${esc(x)}</option>`).join('')}function filtered(){let d=stories.slice(),q=n($('#q').value);if(cat==='In India')d=d.filter(x=>n(x.country)==='india');else if(cat!=='Home')d=d.filter(x=>n(x.category)===n(cat));if(selected!=='All')d=d.filter(x=>n(x.country)===n(selected));else if(region!=='All')d=d.filter(x=>(REG[region]||[]).some(c=>n(c)===n(x.country)));if(q)d=d.filter(x=>n([x.headline,x.summary,x.country,x.category].join(' ')).includes(q));return d}function render(){if(!stories.length)return;let d=filtered(),f=cat==='Home'&&!$('#q').value&&selected==='All'&&region==='All'?d[0]:null;$('#notice').textContent=`Live news · ${stories.length} stories available`;$('#hero').innerHTML=f?`<article class="hero">${chips(f)}<h1>${esc(f.headline)}</h1><p>${esc(f.summary||'')}</p><button class="read" data-open="${esc(f.id)}">Read full story →</button></article>`:'';let a=f?d.slice(1):d;$('#listTitle').textContent=selected!=='All'?selected:region!=='All'?region:'Top Stories · Worldwide';$('#count').textContent=`${d.length} stories`;$('#grid').innerHTML=a.length?a.map(s=>`<article class="card">${chips(s)}<h3>${esc(s.headline)}</h3><p>${esc(s.summary||'')}</p><button class="read" data-open="${esc(s.id)}">Read full story →</button></article>`).join(''):'<div class="card">No stories available for this selection right now</div>'}async function open(id){let s=stories.find(x=>String(x.id)===String(id));if(!s)return;$('#home').classList.add('hidden');let d=$('#detail');d.classList.remove('hidden');d.innerHTML=`<button class="back" id="back">← Back to stories</button><article class="article">${chips(s)}<h1>${esc(s.headline)}</h1><p class="lead">${esc(s.summary||'')}</p><section class="section"><h2>Story Brief</h2><div id="brief">Loading…</div></section><section class="section"><h2>Full Report</h2><div id="report">Loading…</div></section><section class="section"><h2>Sources & attribution</h2><div id="sources">Loading…</div></section></article>`;$('#back').onclick=()=>{$('#detail').classList.add('hidden');$('#home').classList.remove('hidden');scrollTo(0,0)};try{let r=await fetch(SB+'/functions/v1/story-brief',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({story_id:id,locale:lang,language:lang})});if(!r.ok)throw 0;let x=await r.json(),p=x?.brief?.points||[],rp=x?.report?.paragraphs||[],src=x?.sources||[];$('#brief').innerHTML=p.length?'<ul>'+p.map(v=>`<li>${esc(v)}</li>`).join('')+'</ul>':'—';let unique=[...new Set(rp.map(v=>String(v).trim()))];$('#report').innerHTML=unique.length?unique.map(v=>`<p>${esc(v)}</p>`).join(''):`<p>${esc(s.body||s.summary||'')}</p><p>Additional context and implications are being prepared from available reporting.</p>`;$('#sources').innerHTML=src.length?src.map(v=>`<p>${esc(v.publisher||v.name||'Source')}</p>`).join(''):'—'}catch{$('#brief').textContent='—';$('#report').innerHTML=`<p>${esc(s.body||s.summary||'')}</p><p>Background, context and implications are unavailable from the live source.</p>`;$('#sources').textContent='—'}}Object.keys(REG).forEach(r=>$('#regions').insertAdjacentHTML('beforeend',`<button data-r="${r}" class="${r==region?'active':''}">${r}</button>`));$('#regions').onclick=e=>{let b=e.target.closest('[data-r]');if(b){region=b.dataset.r;selected='All';countries();$('#regions').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.r==region));render()}};$('#country').onchange=e=>{selected=e.target.value;render()};$('#searchBtn').onclick=render;$('#q').onkeydown=e=>e.key==='Enter'&&render();document.onclick=e=>{let b=e.target.closest('[data-open]');if(b)open(b.dataset.open)};$('#lang').onchange=e=>{lang=e.target.value;localStorage.gn_lang=lang;document.documentElement.dir=['ar','ur'].includes(lang)?'rtl':'ltr';render()};nav();countries();fetch('/api/news').then(r=>r.json()).then(x=>{stories=Array.isArray(x)?x:[];countries();render()}).catch(()=>$('#notice').textContent='Unable to load live news.');})();</script></body></html>
